name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            mcp-spec: "mcp<2"
          - python-version: "3.12"
            mcp-spec: "mcp<2"
          - python-version: "3.12"
            mcp-spec: "mcp>=2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.mcp-spec }}" requests pytest

      - name: Compile
        run: python -m py_compile mcp_ashare.py

      - name: Test
        run: pytest -q
